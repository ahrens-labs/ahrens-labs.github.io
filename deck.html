  <script>
    (function () {
      function getStorageKey() {
        const uid = localStorage.getItem('ahrenslabs_userId') || 'guest';
        return 'deck_data_' + uid;
      }

      function deckApiBase() {
        return window.AHRENS_LABS_API_BASE || window.AHRENS_API_URL || '';
      }

      const deckSyncClientId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : ('dk-' + Math.random().toString(36).slice(2) + Date.now().toString(36));

      let cloudSyncEnabled = false;
      let suppressCloudSync = false;
      let cloudSyncTimer = null;
      let deckSyncFingerprint = '';
      let deckSyncSocket = null;
      let deckSyncPollTimer = null;
      let deckSyncPingTimer = null;
      let deckSyncReconnectTimer = null;
      let deckSyncRefreshTimer = null;
      let deckSyncRefreshing = false;
      let deckResumeTimer = null;
      let deckBootComplete = false;
      let deckLastLocalMutationAt = 0;

      function uidId() {
        return 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      }

      function normalizeItems(raw) {
        if (!Array.isArray(raw)) return [];
        return raw.map((it) => ({
          id: it.id || uidId(),
          text: it.text || '',
          done: !!it.done,
          doneAt: it.doneAt || null,
        }));
      }

      function section(src) {
        src = src || {};
        return {
          id: src.id || uidId(),
          title: src.title || '',
          body: src.body || '',
        };
      }

      function splitSectionLegacy(sec) {
        if (!sec) return { section: section({}), items: [] };
        if (sec.type === 'checklist') {
          return {
            section: section({ id: sec.id, title: sec.title, body: '' }),
            items: normalizeItems(sec.items),
          };
        }
        return {
          section: section(sec),
          items: normalizeItems(sec.items),
        };
      }

      function cardFromLegacy(src) {
        const title = src.title || src.front || '';
        const body = src.body || src.back || '';
        let checklist = normalizeItems(src.checklist);
        let sections = [];
        if (Array.isArray(src.sections)) {
          src.sections.forEach((sec) => {
            const split = splitSectionLegacy(sec);
            sections.push(split.section);
            checklist = checklist.concat(split.items);
          });
        } else if (body) {
          sections = [section({ body })];
        }
        return {
          id: src.id || uidId(),
          title: title,
          createdAt: src.createdAt || Date.now(),
          updatedAt: src.updatedAt || Date.now(),
          sections: sections,
          checklist: checklist,
        };
      }

      function normalizeSection(sec) {
        return splitSectionLegacy(sec).section;
      }

      function ensureCardChecklist(card) {
        if (!Array.isArray(card.checklist)) card.checklist = [];
        return card.checklist;
      }

      function cardsFromDeck(deck) {
        if (Array.isArray(deck.cards) && deck.cards.length) {
          return deck.cards.map(cardFromLegacy);
        }
        if (Array.isArray(deck.notes)) {
          return deck.notes.map(cardFromLegacy);
        }
        return [];
      }

      function stacksFromDeck(deck) {
        if (!Array.isArray(deck.stacks)) return [];
        return deck.stacks.map((s) => ({
          id: s.id || uidId(),
          name: s.name || 'Untitled stack',
          createdAt: s.createdAt || Date.now(),
          cards: (Array.isArray(s.cards) ? s.cards : []).map(cardFromLegacy),
        }));
      }

      function parseDeckState(raw) {
        const decks = (Array.isArray(raw?.decks) ? raw.decks : []).map((d) => ({
          id: d.id || uidId(),
          name: d.name || 'Untitled',
          createdAt: d.createdAt || Date.now(),
          cards: cardsFromDeck(d),
          stacks: stacksFromDeck(d),
        }));
        return { decks };
      }

      function load() {
        try {
          return parseDeckState(JSON.parse(localStorage.getItem(getStorageKey()) || '{}'));
        } catch {
          return { decks: [] };
        }
      }

      function readGuestDeckBackup() {
        try {
          return parseDeckState(JSON.parse(localStorage.getItem('deck_data_guest') || '{}'));
        } catch {
          return { decks: [] };
        }
      }

      function persistDeckLocally() {
        localStorage.setItem(getStorageKey(), JSON.stringify(state));
      }

      function buildDeckCloudPayload() {
        return { decks: Array.isArray(state.decks) ? state.decks : [] };
      }

      function reconcileActiveDeckSelection() {
        if (activeDeckId && !deckById(activeDeckId)) {
          activeDeckId = state.decks[0] ? state.decks[0].id : null;
          activeStackId = null;
          activeCardId = null;
        }
        if (activeCardId && activeDeckId) {
          const found = findCardInDeck(activeDeckId, activeCardId);
          if (!found) activeCardId = null;
          else activeStackId = found.stack ? found.stack.id : null;
        }
        if (activeStackId && activeDeckId && !stackById(deckById(activeDeckId), activeStackId)) {
          activeStackId = null;
        }
      }

      function applyDeckCloudPayload(payload) {
        suppressCloudSync = true;
        state = parseDeckState(payload || {});
        reconcileActiveDeckSelection();
        suppressCloudSync = false;
      }

      function renderCurrentView() {
        if (currentView === 'decks') renderDecks();
        else if (currentView === 'cards') renderCards();
        else if (currentView === 'card') renderCard();
        else if (currentView === 'review') renderReview();
      }

      async function updateDeckSyncFingerprint() {
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (!sessionId) return;
        try {
          const response = await fetch(deckApiBase() + '/api/deck/sync-version', {
            method: 'GET',
            headers: {
              Authorization: 'Bearer ' + sessionId,
              'X-Deck-Sync-Client': deckSyncClientId,
            },
          });
          if (!response.ok) return;
          const data = await response.json();
          deckSyncFingerprint = data.fingerprint || '';
        } catch {
          /* ignore */
        }
      }

      async function loadDeckFromCloud() {
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (!sessionId) return false;
        try {
          const response = await fetch(deckApiBase() + '/api/deck/load', {
            method: 'GET',
            headers: { Authorization: 'Bearer ' + sessionId },
          });
          if (!response.ok) return false;
          const data = await response.json();
          const cloudDecks = Array.isArray(data.decks) ? data.decks : [];
          if (!cloudDecks.length) return false;
          applyDeckCloudPayload(data);
          return true;
        } catch (error) {
          console.error('Failed to load deck data from cloud:', error);
          return false;
        }
      }

      function queueDeckCloudSync() {
        if (!cloudSyncEnabled || suppressCloudSync) return;
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (!sessionId) return;
        if (cloudSyncTimer) clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(() => {
          syncDeckToCloud();
        }, 700);
      }

      function flushDeckCloudSync() {
        if (!cloudSyncEnabled || suppressCloudSync) return Promise.resolve();
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (!sessionId) return Promise.resolve();
        if (cloudSyncTimer) {
          clearTimeout(cloudSyncTimer);
          cloudSyncTimer = null;
        }
        return syncDeckToCloud();
      }

      async function syncDeckToCloud() {
        if (!cloudSyncEnabled || suppressCloudSync) return;
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (!sessionId) return;
        try {
          await fetch(deckApiBase() + '/api/deck/sync', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + sessionId,
              'X-Deck-Sync-Client': deckSyncClientId,
            },
            body: JSON.stringify(buildDeckCloudPayload()),
          });
          await updateDeckSyncFingerprint();
        } catch (error) {
          console.error('Failed to sync deck data to cloud:', error);
        }
      }

      async function refreshDeckFromCloud() {
        if (deckSyncRefreshing) return;
        deckSyncRefreshing = true;
        try {
          const loaded = await loadDeckFromCloud();
          if (loaded) {
            persistDeckLocally();
            renderCurrentView();
          }
          await updateDeckSyncFingerprint();
        } finally {
          deckSyncRefreshing = false;
        }
      }

      function deckSyncWsUrl() {
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        const base = deckApiBase()
          .replace(/^http:\/\//i, 'ws://')
          .replace(/^https:\/\//i, 'wss://');
        return base + '/api/deck/live?session=' + encodeURIComponent(sessionId || '');
      }

      function scheduleDeckSyncRefresh(evt) {
        clearTimeout(deckSyncRefreshTimer);
        deckSyncRefreshTimer = setTimeout(async () => {
          if (!evt || evt.sourceClientId === deckSyncClientId) return;
          await refreshDeckFromCloud();
        }, 120);
      }

      async function pollDeckSyncVersion() {
        if (document.hidden || !cloudSyncEnabled || deckSyncRefreshing) return;
        if (deckSyncSocket && deckSyncSocket.readyState === WebSocket.OPEN) return;
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (!sessionId) return;
        try {
          const response = await fetch(deckApiBase() + '/api/deck/sync-version', {
            method: 'GET',
            headers: {
              Authorization: 'Bearer ' + sessionId,
              'X-Deck-Sync-Client': deckSyncClientId,
            },
          });
          if (!response.ok) return;
          const data = await response.json();
          const next = data.fingerprint || '';
          if (deckSyncFingerprint && next && next !== deckSyncFingerprint) {
            const recentLocalEdit = (Date.now() - deckLastLocalMutationAt) < 120000;
            if (recentLocalEdit) {
              deckSyncFingerprint = next;
              return;
            }
            await refreshDeckFromCloud();
            return;
          }
          deckSyncFingerprint = next;
        } catch {
          ensureDeckSyncConnected();
        }
      }

      function startDeckSyncPoll() {
        clearInterval(deckSyncPollTimer);
        const intervalMs = document.hidden ? 60000 : 15000;
        deckSyncPollTimer = setInterval(pollDeckSyncVersion, intervalMs);
      }

      function ensureDeckSyncConnected() {
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (!sessionId || !cloudSyncEnabled) return;
        if (deckSyncSocket && deckSyncSocket.readyState === WebSocket.OPEN) return;
        if (deckSyncSocket) {
          try { deckSyncSocket.close(); } catch { /* ignore */ }
          deckSyncSocket = null;
        }
        connectDeckSync();
      }

      function handleDeckResume() {
        clearTimeout(deckResumeTimer);
        deckResumeTimer = setTimeout(async () => {
          if (!deckBootComplete) return;
          startDeckSyncPoll();
          ensureDeckSyncConnected();
          const sessionId = localStorage.getItem('ahrenslabs_sessionId');
          if (sessionId && cloudSyncEnabled) {
            if (cloudSyncTimer) {
              clearTimeout(cloudSyncTimer);
              cloudSyncTimer = null;
            }
            await refreshDeckFromCloud();
          } else {
            await pollDeckSyncVersion();
          }
        }, 50);
      }

      function connectDeckSync() {
        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (!sessionId || !cloudSyncEnabled || deckSyncSocket) return;
        try {
          deckSyncSocket = new WebSocket(deckSyncWsUrl());
        } catch {
          deckSyncSocket = null;
          return;
        }
        deckSyncSocket.addEventListener('open', () => {
          clearInterval(deckSyncPingTimer);
          deckSyncPingTimer = setInterval(() => {
            if (deckSyncSocket && deckSyncSocket.readyState === WebSocket.OPEN) {
              try { deckSyncSocket.send('ping'); } catch { /* ignore */ }
            }
          }, 25000);
        });
        deckSyncSocket.addEventListener('message', (e) => {
          if (e.data === 'pong') return;
          try {
            scheduleDeckSyncRefresh(JSON.parse(e.data));
          } catch {
            /* ignore malformed payloads */
          }
        });
        deckSyncSocket.addEventListener('close', () => {
          deckSyncSocket = null;
          clearInterval(deckSyncPingTimer);
          clearTimeout(deckSyncReconnectTimer);
          deckSyncReconnectTimer = setTimeout(connectDeckSync, 3000);
        });
        deckSyncSocket.addEventListener('error', () => {
          try { deckSyncSocket.close(); } catch { /* ignore */ }
        });
      }

      async function bootDeck() {
        const guestBackup = readGuestDeckBackup();
        state = load();
        activeDeckId = state.decks[0] ? state.decks[0].id : null;
        persistDeckLocally();

        const sessionId = localStorage.getItem('ahrenslabs_sessionId');
        if (sessionId) {
          const hadCloud = await loadDeckFromCloud();
          if (!hadCloud && guestBackup.decks.length) {
            state = guestBackup;
            activeDeckId = state.decks[0] ? state.decks[0].id : null;
            persistDeckLocally();
            await syncDeckToCloud();
          } else {
            persistDeckLocally();
          }
          await updateDeckSyncFingerprint();
        }

        cloudSyncEnabled = true;
        applyRouteFromUrl(true);
        connectDeckSync();
        startDeckSyncPoll();
        deckBootComplete = true;
        await updateDeckSyncFingerprint();
      }

      function save() {
        deckLastLocalMutationAt = Date.now();
        persistDeckLocally();
        queueDeckCloudSync();
      }
      let activeStackId = null;
      let activeCardId = null;
      let deckEditing = false;
      let reviewDeckId = null;
      let reviewStackId = null;
      let reviewScope = 'deck';
      let reviewCardId = null;
      let currentView = 'decks';
      let modalResolve = null;
      let modalMode = 'confirm';
      let suppressRouteSync = false;

      const modalField = document.getElementById('dk-modal-field');
      const modalFieldLabel = document.getElementById('dk-modal-field-label');
      const modalFieldInput = document.getElementById('dk-modal-field-input');

      function stackById(deck, stackId) {
        if (!deck || !stackId) return null;
        return (deck.stacks || []).find((s) => s.id === stackId) || null;
      }

      function findCardInDeck(deckId, cardId) {
        const deck = deckById(deckId);
        if (!deck || !cardId) return null;
        const root = (deck.cards || []).find((c) => c.id === cardId);
        if (root) return { deck, stack: null, card: root };
        for (const stack of deck.stacks || []) {
          const card = (stack.cards || []).find((c) => c.id === cardId);
          if (card) return { deck, stack, card };
        }
        return null;
      }

      function deckStats(deck) {
        const rootCards = (deck.cards || []).length;
        const stacks = (deck.stacks || []).length;
        const stackCards = (deck.stacks || []).reduce((n, s) => n + (s.cards || []).length, 0);
        return {
          rootCards,
          stacks,
          totalCards: rootCards + stackCards,
        };
      }

      function allReviewCards(deck, scope, stackId, cardId) {
        if (!deck) return [];
        if (scope === 'card' && cardId) {
          const found = findCardInDeck(deck.id, cardId);
          return found ? [found.card] : [];
        }
        if (scope === 'stack' && stackId) {
          const stack = stackById(deck, stackId);
          return stack ? (stack.cards || []).slice() : [];
        }
        const list = (deck.cards || []).slice();
        (deck.stacks || []).forEach((stack) => {
          list.push.apply(list, stack.cards || []);
        });
        return list;
      }

      function parseCardsRoute(parts) {
        const deckId = parts[1] || null;
        if (!deckId) return { tab: 'cards' };
        if (parts[2] === 'settings') return { tab: 'cards', deckId, deckEdit: true };
        if (parts[2] === 'stack' && parts[3]) {
          const stackId = parts[3];
          if (parts[4] === 'review') {
            return {
              tab: 'cards',
              deckId,
              stackId,
              review: true,
              reviewScope: 'stack',
              cardId: parts[5] || null,
            };
          }
          if (parts[4] === 'card' && parts[5]) {
            return {
              tab: 'cards',
              deckId,
              stackId,
              cardId: parts[5],
            };
          }
          return { tab: 'cards', deckId, stackId };
        }
        if (parts[2] === 'review') {
          if (parts[3] === 'card' && parts[4]) {
            return {
              tab: 'cards',
              deckId,
              review: true,
              reviewScope: 'card',
              cardId: parts[4],
            };
          }
          return {
            tab: 'cards',
            deckId,
            review: true,
            reviewScope: 'deck',
            cardId: parts[3] || null,
          };
        }
        if (parts[2] === 'card' && parts[3]) {
          return { tab: 'cards', deckId, cardId: parts[3] };
        }
        return { tab: 'cards', deckId };
      }

      function parseRoute() {
        const raw = (location.hash || '#/decks').replace(/^#/, '').trim();
        const parts = raw.split('/').filter(Boolean);
        if (!parts.length || parts[0] === 'decks') return { tab: 'decks' };
        if (parts[0] === 'cards') return parseCardsRoute(parts);
        if (parts[0] === 'deck' && parts[1]) {
          const tail = parts.slice(2);
          if (tail[0] === 'review') return parseCardsRoute(['cards', parts[1], 'review', tail[1]].filter(Boolean));
          if (tail[0] === 'settings') return parseCardsRoute(['cards', parts[1], 'settings']);
          if (tail[0] === 'card' && tail[1]) {
            return parseCardsRoute(['cards', parts[1], 'card', tail[1], tail[2]].filter(Boolean));
          }
          return parseCardsRoute(['cards', parts[1]]);
        }
        return { tab: 'decks' };
      }

      function buildHash() {
        if (currentView === 'review' && reviewDeckId) {
          if (reviewScope === 'stack' && reviewStackId) {
            const base = '#/cards/' + reviewDeckId + '/stack/' + reviewStackId + '/review';
            return reviewCardId ? base + '/' + reviewCardId : base;
          }
          if (reviewScope === 'card' && reviewCardId) {
            return '#/cards/' + reviewDeckId + '/review/card/' + reviewCardId;
          }
          const base = '#/cards/' + reviewDeckId + '/review';
          return reviewCardId ? base + '/' + reviewCardId : base;
        }
        if (currentView === 'card' && activeDeckId && activeCardId) {
          const loc = findCardInDeck(activeDeckId, activeCardId);
          const stackPart = loc && loc.stack ? '/stack/' + loc.stack.id : '';
          const base = '#/cards/' + activeDeckId + stackPart + '/card/' + activeCardId;
          return base;
        }
        if (currentView === 'cards') {
          if (!activeDeckId) return '#/cards';
          if (deckEditing) return '#/cards/' + activeDeckId + '/settings';
          if (activeStackId) return '#/cards/' + activeDeckId + '/stack/' + activeStackId;
          return '#/cards/' + activeDeckId;
        }
        return '#/decks';
      }

      function syncUrl(replace) {
        if (suppressRouteSync) return;
        const nextHash = buildHash();
        if ((location.hash || '#/decks') === nextHash) return;
        suppressRouteSync = true;
        if (replace) history.replaceState(null, '', nextHash);
        else history.pushState(null, '', nextHash);
        suppressRouteSync = false;
      }

      function cardInDeck(deckId, cardId) {
        const found = findCardInDeck(deckId, cardId);
        return found ? found.card : null;
      }

      function clearReviewState() {
        reviewDeckId = null;
        reviewStackId = null;
        reviewScope = 'deck';
        reviewCardId = null;
      }

      function applyRouteFromUrl(replaceInvalid) {
        if (currentView === 'card' && activeCardId) {
          const route = parseRoute();
          if (!routeMatchesActiveCard(route) && !tryCommitCardMeta()) {
            syncUrl(true);
            showAlert({
              title: 'Name required',
              message: 'Every card needs a name. Enter one before continuing.',
            }).then(() => {
              const input = document.getElementById('card-title');
              input.focus();
              input.select();
            });
            return;
          }
        }
        const route = parseRoute();
        if (route.tab === 'decks') {
          activeCardId = null;
          activeStackId = null;
          deckEditing = false;
          clearReviewState();
          show('decks');
          renderDecks();
          if (replaceInvalid) syncUrl(true);
          return;
        }
        const deck = route.deckId ? deckById(route.deckId) : ensureActiveDeck();
        if (!deck) {
          activeCardId = null;
          activeStackId = null;
          deckEditing = false;
          clearReviewState();
          show('decks');
          renderDecks();
          syncUrl(true);
          return;
        }
        activeDeckId = deck.id;
        if (route.review) {
          activeCardId = null;
          activeStackId = route.stackId || null;
          deckEditing = false;
          reviewDeckId = deck.id;
          reviewStackId = route.stackId || null;
          reviewScope = route.reviewScope || 'deck';
          const cards = allReviewCards(deck, reviewScope, reviewStackId, route.cardId);
          if (!cards.length) {
            clearReviewState();
            show(route.stackId ? 'cards' : 'cards');
            activeStackId = route.stackId || null;
            renderCards();
            syncUrl(true);
            return;
          }
          reviewCardId = route.cardId && cardInDeck(deck.id, route.cardId)
            ? route.cardId
            : cards[0].id;
          show('review');
          renderReview();
          syncUrl(replaceInvalid);
          return;
        }
        if (route.cardId) {
          const found = findCardInDeck(deck.id, route.cardId);
          if (!found) {
            activeCardId = null;
            activeStackId = route.stackId || null;
          deckEditing = false;
          clearReviewState();
          show('cards');
          renderCards();
          syncUrl(true);
          return;
          }
          activeCardId = found.card.id;
          activeStackId = found.stack ? found.stack.id : (route.stackId || null);
          deckEditing = false;
          clearReviewState();
          show('card');
          renderCard();
          syncUrl(replaceInvalid);
          return;
        }
        activeCardId = null;
        activeStackId = route.stackId || null;
        deckEditing = !!route.deckEdit;
        clearReviewState();
        if (activeStackId && !stackById(deck, activeStackId)) {
          activeStackId = null;
        }
        show('cards');
        renderCards();
        syncUrl(replaceInvalid);
      }

      const modalEl = document.getElementById('dk-modal');
      const modalTitle = document.getElementById('dk-modal-title');
      const modalMessage = document.getElementById('dk-modal-message');
      const modalCancel = document.getElementById('dk-modal-cancel');
      const modalOk = document.getElementById('dk-modal-ok');

      function closeModal(result) {
        modalEl.classList.remove('open');
        modalField.classList.add('hidden');
        const resolve = modalResolve;
        const mode = modalMode;
        modalResolve = null;
        modalMode = 'confirm';
        if (!resolve) return;
        if (mode === 'prompt') {
          resolve(result ? modalFieldInput.value.trim() : null);
          return;
        }
        resolve(!!result);
      }

      function showModal(opts) {
        return new Promise((resolve) => {
          if (modalResolve) modalResolve(false);
          modalMode = 'confirm';
          modalResolve = resolve;
          modalTitle.textContent = opts.title || 'Confirm';
          modalMessage.textContent = opts.message || '';
          modalField.classList.add('hidden');
          modalOk.textContent = opts.okLabel || 'OK';
          modalOk.className = 'dk-btn ' + (opts.danger ? 'dk-btn-danger' : 'dk-btn-primary');
          modalCancel.classList.toggle('hidden', !!opts.hideCancel);
          modalCancel.textContent = opts.cancelLabel || 'Cancel';
          modalEl.classList.add('open');
          modalOk.focus();
        });
      }

      function showPrompt(opts) {
        return new Promise((resolve) => {
          if (modalResolve) modalResolve(false);
          modalMode = 'prompt';
          modalResolve = resolve;
          modalTitle.textContent = opts.title || 'Name';
          modalMessage.textContent = opts.message || '';
          modalField.classList.remove('hidden');
          modalFieldLabel.textContent = opts.label || 'Name';
          modalFieldInput.value = opts.defaultValue || '';
          modalFieldInput.maxLength = opts.maxLength || 80;
          modalOk.textContent = opts.okLabel || 'Save';
          modalOk.className = 'dk-btn dk-btn-primary';
          modalCancel.classList.remove('hidden');
          modalCancel.textContent = opts.cancelLabel || 'Cancel';
          modalEl.classList.add('open');
          setTimeout(() => {
            modalFieldInput.focus();
            modalFieldInput.select();
          }, 0);
        });
      }

      function showConfirm(opts) { return showModal(opts); }
      function showAlert(opts) {
        return showModal({
          title: opts.title || 'Deck',
          message: opts.message || '',
          okLabel: opts.okLabel || 'OK',
          hideCancel: true,
        });
      }

      modalCancel.addEventListener('click', () => closeModal(false));
      modalOk.addEventListener('click', () => closeModal(true));
      modalFieldInput.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && modalMode === 'prompt') {
          ev.preventDefault();
          closeModal(true);
        }
      });
      modalEl.addEventListener('click', (ev) => {
        if (ev.target === modalEl) closeModal(false);
      });
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && modalEl.classList.contains('open')) {
          ev.preventDefault();
          closeModal(false);
        }
      });

      const views = {
        decks: document.getElementById('view-decks'),
        cards: document.getElementById('view-cards'),
        card: document.getElementById('view-card'),
        review: document.getElementById('view-review'),
      };

      function show(name) {
        currentView = name;
        Object.keys(views).forEach((k) => views[k].classList.toggle('hidden', k !== name));
        document.body.classList.toggle('dk-reviewing', name === 'review');
        const tab = name === 'decks' ? 'decks' : 'cards';
        document.querySelectorAll('.dk-bottom-nav-item').forEach((btn) => {
          btn.classList.toggle('active', btn.getAttribute('data-dk-tab') === tab);
        });
      }

      function deckById(id) {
        return state.decks.find((d) => d.id === id);
      }

      function ensureActiveDeck() {
        if (deckById(activeDeckId)) return deckById(activeDeckId);
        const first = state.decks[0];
        if (first) {
          activeDeckId = first.id;
          return first;
        }
        return null;
      }

      function activeCard() {
        if (!activeDeckId || !activeCardId) return null;
        const found = findCardInDeck(activeDeckId, activeCardId);
        return found ? found.card : null;
      }

      function activeCardLocation() {
        if (!activeDeckId || !activeCardId) return null;
        return findCardInDeck(activeDeckId, activeCardId);
      }

      function cardCount(deck) {
        return deckStats(deck).totalCards;
      }

      function cardSummary(card) {
        const sections = card.sections || [];
        const checklist = ensureCardChecklist(card);
        const openTasks = checklist.filter((it) => !it.done && (it.text || '').trim()).length;
        const parts = [];
        parts.push(sections.length + (sections.length === 1 ? ' section' : ' sections'));
        if (openTasks) parts.push(openTasks + (openTasks === 1 ? ' open task' : ' open tasks'));
        const text = sections.find((s) => (s.body || '').trim());
        if (text) {
          const snip = text.body.replace(/\s+/g, ' ').trim();
          return parts.join(' · ') + (snip ? ' · ' + snip.slice(0, 80) : '');
        }
        return parts.join(' · ') || 'Empty card';
      }

      function cardSearchHaystack(card) {
        const checklist = ensureCardChecklist(card);
        return [card.title]
          .concat((card.sections || []).map((s) => (s.title || '') + ' ' + (s.body || '')))
          .concat(checklist.map((it) => it.text))
          .join(' ');
      }

      function renderDecks() {
        const list = document.getElementById('deck-list');
        if (!state.decks.length) {
          list.innerHTML = '<div class="dk-empty"><strong>No decks yet.</strong><br>Create a deck, then add cards into it.</div>';
          return;
        }
        list.innerHTML = '';
        state.decks.forEach((d) => {
          const wrap = document.createElement('article');
          wrap.className = 'dk-deck-item';
          const open = document.createElement('button');
          open.type = 'button';
          open.className = 'dk-deck-open';
          const stats = deckStats(d);
          open.innerHTML = '<h3></h3><p></p>';
          open.querySelector('h3').textContent = d.name || 'Untitled';
          const bits = [];
          if (stats.totalCards) bits.push(stats.totalCards + (stats.totalCards === 1 ? ' card' : ' cards'));
          if (stats.stacks) bits.push(stats.stacks + (stats.stacks === 1 ? ' stack' : ' stacks'));
          open.querySelector('p').textContent = bits.length ? bits.join(' · ') : 'Empty deck';
          open.addEventListener('click', () => openDeck(d.id));
          const actions = document.createElement('div');
          actions.className = 'dk-deck-actions';
          const reviewBtn = document.createElement('button');
          reviewBtn.type = 'button';
          reviewBtn.className = 'dk-btn dk-btn-primary';
          reviewBtn.textContent = 'Review';
          reviewBtn.disabled = !stats.totalCards;
          reviewBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            openReview(d.id, { scope: 'deck' });
          });
          const openBtn = document.createElement('button');
          openBtn.type = 'button';
          openBtn.className = 'dk-btn dk-btn-ghost';
          openBtn.textContent = 'Open';
          openBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            openDeck(d.id);
          });
          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'dk-btn dk-btn-ghost';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            editDeckFromList(d.id);
          });
          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'dk-btn dk-btn-danger';
          deleteBtn.textContent = 'Delete';
          deleteBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            deleteDeckById(d.id);
          });
          actions.append(openBtn, reviewBtn, editBtn, deleteBtn);
          wrap.append(open, actions);
          list.appendChild(wrap);
        });
      }

      async function editDeckFromList(deckId) {
        const deck = deckById(deckId);
        if (!deck) return;
        const name = await showPrompt({
          title: 'Rename deck',
          message: 'Choose a new name for this deck.',
          label: 'Deck name',
          defaultValue: deck.name || '',
          okLabel: 'Save',
        });
        if (name === null) return;
        deck.name = name.trim() || 'Untitled';
        save();
        renderDecks();
      }

      async function deleteDeckById(deckId) {
        const deck = deckById(deckId);
        if (!deck) return;
        const stats = deckStats(deck);
        const extra = stats.totalCards || stats.stacks
          ? ' and everything in it'
          : '';
        const ok = await showConfirm({
          title: 'Delete deck?',
          message: 'Delete “' + (deck.name || 'this deck') + '”' + extra + '? This cannot be undone.',
          okLabel: 'Delete',
          danger: true,
        });
        if (!ok) return;
        const wasActive = activeDeckId === deckId;
        state.decks = state.decks.filter((d) => d.id !== deckId);
        if (wasActive) {
          activeDeckId = state.decks[0] ? state.decks[0].id : null;
          activeCardId = null;
          activeStackId = null;
          deckEditing = false;
        }
        save();
        if (wasActive && currentView !== 'decks') {
          showDecks({ replaceUrl: false });
        } else {
          renderDecks();
        }
      }

      function renderCardListItem(card, deckId, stackId) {
        const row = document.createElement('article');
        row.className = 'dk-card-preview-item';
        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'dk-card-preview-open';
        const inner = document.createElement('div');
        inner.className = 'dk-card-preview-inner';
        const title = document.createElement('h3');
        title.className = 'dk-card-preview-title';
        title.textContent = card.title || 'Untitled card';
        inner.appendChild(title);
        const body = document.createElement('div');
        body.className = 'dk-card-preview-body';
        appendCardPreview(card, body);
        inner.appendChild(body);
        open.appendChild(inner);
        open.addEventListener('click', () => openCard(card.id, { stackId: stackId || null }));
        const actions = document.createElement('div');
        actions.className = 'dk-item-actions';
        actions.style.padding = '0 12px 12px';
        const reviewBtn = document.createElement('button');
        reviewBtn.type = 'button';
        reviewBtn.className = 'dk-btn dk-btn-ghost dk-btn-block';
        reviewBtn.textContent = 'Review';
        reviewBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openReview(deckId, { scope: 'card', cardId: card.id, stackId: stackId || null });
        });
        actions.appendChild(reviewBtn);
        row.append(open, actions);
        return row;
      }

      function renderChecklistStatic(card, host) {
        host.innerHTML = '';
        const checklist = ensureCardChecklist(card);
        const visible = checklist.filter((it) => (it.text || '').trim());
        if (!visible.length) return false;
        const open = visible.filter((it) => !it.done);
        const done = visible.filter((it) => it.done);
        function staticRow(it) {
          const row = document.createElement('div');
          row.className = 'dk-check-static-row' + (it.done ? ' done' : '');
          const mark = document.createElement('span');
          mark.className = 'dk-check-static-mark';
          mark.textContent = it.done ? '✓' : '○';
          const text = document.createElement('span');
          text.textContent = it.text;
          row.append(mark, text);
          return row;
        }
        const openList = document.createElement('div');
        openList.className = 'dk-check-list';
        open.forEach((it) => openList.appendChild(staticRow(it)));
        host.appendChild(openList);
        if (done.length) {
          const label = document.createElement('div');
          label.className = 'dk-completed-label';
          label.textContent = 'Completed';
          const doneList = document.createElement('div');
          doneList.className = 'dk-check-list';
          done.forEach((it) => doneList.appendChild(staticRow(it)));
          host.append(label, doneList);
        }
        return true;
      }

      function appendCardPreview(card, host) {
        if (!cardHasContent(card)) {
          host.innerHTML = '<p class="dk-card-preview-empty">Empty card — tap to add notes or tasks</p>';
          return;
        }
        renderCardSectionsView(card, host, '');
        const checklistHost = document.createElement('div');
        if (renderChecklistStatic(card, checklistHost)) {
          const wrap = document.createElement('div');
          wrap.className = 'dk-card-checklist';
          const label = document.createElement('p');
          label.className = 'dk-card-checklist-label';
          label.textContent = 'Checklist';
          wrap.append(label, checklistHost);
          host.appendChild(wrap);
        }
      }

      function renderStackItem(stack, deckId) {
        const row = document.createElement('article');
        row.className = 'dk-stack-item';
        const n = (stack.cards || []).length;
        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'dk-stack-open';
        open.innerHTML = '<h3></h3><p></p>';
        open.querySelector('h3').innerHTML = '<span class="dk-stack-badge">Stack</span>' + (stack.name || 'Untitled stack');
        open.querySelector('p').textContent = n + (n === 1 ? ' card' : ' cards');
        open.addEventListener('click', () => openStack(stack.id));
        const actions = document.createElement('div');
        actions.className = 'dk-item-actions';
        const reviewBtn = document.createElement('button');
        reviewBtn.type = 'button';
        reviewBtn.className = 'dk-btn dk-btn-ghost';
        reviewBtn.textContent = 'Review';
        reviewBtn.disabled = !n;
        reviewBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openReview(deckId, { scope: 'stack', stackId: stack.id });
        });
        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'dk-btn dk-btn-primary';
        openBtn.textContent = 'Open';
        openBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openStack(stack.id);
        });
        actions.append(openBtn, reviewBtn);
        row.append(open, actions);
        return row;
      }

      function renderCards() {
        const deck = ensureActiveDeck();
        if (!deck) return showDecks({ updateUrl: true });
        const stack = activeStackId ? stackById(deck, activeStackId) : null;
        const inStack = !!stack;
        document.getElementById('cards-list-actions-root').classList.toggle('hidden', inStack || deckEditing);
        document.getElementById('cards-list-actions-stack').classList.toggle('hidden', !inStack || deckEditing);
        document.getElementById('btn-back-decks').textContent = inStack
          ? '← ' + (deck.name || 'Deck')
          : '← All decks';
        document.getElementById('cards-heading').textContent = inStack
          ? (stack.name || 'Stack')
          : (deck.name || 'Cards');
        document.getElementById('cards-sub').textContent = inStack
          ? ((stack.cards || []).length ? 'Cards in this stack.' : 'No cards in this stack yet.')
          : (deckStats(deck).totalCards || deckStats(deck).stacks
            ? 'Open a stack or card, or create something new.'
            : 'Add a stack or card to get started.');
        document.getElementById('cards-view-mode').classList.toggle('hidden', deckEditing);
        document.getElementById('cards-edit-mode').classList.toggle('hidden', !deckEditing);
        if (deckEditing) {
          document.getElementById('deck-name').value = deck.name || '';
        }
        const q = document.getElementById('card-search').value.trim().toLowerCase();
        const list = document.getElementById('card-list');
        list.innerHTML = '';

        if (inStack) {
          const cards = (stack.cards || []).filter((c) => {
            if (!q) return true;
            return cardSearchHaystack(c).toLowerCase().includes(q);
          });
          if (!stack.cards.length) {
            list.innerHTML = '<div class="dk-empty">This stack has no cards yet.</div>';
            return;
          }
          if (!cards.length) {
            list.innerHTML = '<div class="dk-empty">No cards match that search.</div>';
            return;
          }
          cards.forEach((c) => list.appendChild(renderCardListItem(c, deck.id, stack.id)));
          return;
        }

        const stacks = (deck.stacks || []).filter((s) => {
          if (!q) return true;
          const hay = (s.name || '') + ' ' + (s.cards || []).map((c) => cardSearchHaystack(c)).join(' ');
          return hay.toLowerCase().includes(q);
        });
        const cards = (deck.cards || []).filter((c) => {
          if (!q) return true;
          return cardSearchHaystack(c).toLowerCase().includes(q);
        });
        if (!deck.stacks.length && !deck.cards.length) {
          list.innerHTML = '<div class="dk-empty">This deck is empty. Add a stack or card.</div>';
          return;
        }
        if (!stacks.length && !cards.length) {
          list.innerHTML = '<div class="dk-empty">Nothing matches that search.</div>';
          return;
        }
        stacks.forEach((s) => list.appendChild(renderStackItem(s, deck.id)));
        cards.forEach((c) => list.appendChild(renderCardListItem(c, deck.id, null)));
      }

      function checkRow(item, done, card, rerender) {
        const checklist = ensureCardChecklist(card);
        const row = document.createElement('div');
        row.className = 'dk-check-row' + (done ? ' done' : '');
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = done;
        box.setAttribute('aria-label', 'Mark complete');
        const text = document.createElement('input');
        text.type = 'text';
        text.className = 'dk-check-text';
        text.value = item.text || '';
        text.placeholder = 'Checklist item';
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'dk-check-remove';
        remove.setAttribute('aria-label', 'Remove item');
        remove.textContent = '×';
        row.append(box, text, remove);
        box.addEventListener('change', () => {
          item.done = box.checked;
          item.doneAt = box.checked ? Date.now() : null;
          touchCard(card);
          rerender();
        });
        text.addEventListener('input', () => {
          item.text = text.value;
          touchCard(card);
        });
        remove.addEventListener('click', () => {
          card.checklist = checklist.filter((it) => it.id !== item.id);
          touchCard(card);
          rerender();
        });
        return row;
      }

      function renderChecklistEdit(card) {
        const host = document.getElementById('card-checklist-edit-list');
        host.innerHTML = '';
        const checklist = ensureCardChecklist(card);
        const wrap = document.createElement('div');
        const open = checklist.filter((it) => !it.done);
        const done = checklist.filter((it) => it.done);
        const openList = document.createElement('div');
        openList.className = 'dk-check-list';
        const rerender = () => renderCard();
        open.forEach((it) => openList.appendChild(checkRow(it, false, card, rerender)));
        const add = document.createElement('input');
        add.type = 'text';
        add.className = 'dk-check-add';
        add.placeholder = 'Add a task…';
        add.addEventListener('keydown', (ev) => {
          if (ev.key !== 'Enter') return;
          ev.preventDefault();
          const value = add.value.trim();
          if (!value) return;
          checklist.push({ id: uidId(), text: value, done: false, doneAt: null });
          add.value = '';
          touchCard(card);
          renderChecklistEdit(card);
          host.querySelector('.dk-check-add')?.focus();
        });
        wrap.append(openList, add);
        if (done.length) {
          const label = document.createElement('div');
          label.className = 'dk-completed-label';
          label.textContent = 'Completed';
          const doneList = document.createElement('div');
          doneList.className = 'dk-check-list';
          done.forEach((it) => doneList.appendChild(checkRow(it, true, card, rerender)));
          wrap.append(label, doneList);
        }
        host.appendChild(wrap);
      }

      function viewCheckRow(item, card, rerenderFn) {
        const row = document.createElement('label');
        row.className = 'dk-view-check-row' + (item.done ? ' done' : '');
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = !!item.done;
        const text = document.createElement('span');
        text.textContent = item.text || 'Untitled item';
        row.append(box, text);
        box.addEventListener('change', () => {
          item.done = box.checked;
          item.doneAt = box.checked ? Date.now() : null;
          touchCard(card);
          (rerenderFn || renderCard)();
        });
        return row;
      }

      function renderChecklistView(card, host, rerenderFn) {
        host.innerHTML = '';
        const checklist = ensureCardChecklist(card);
        const open = checklist.filter((it) => !it.done && (it.text || '').trim());
        const done = checklist.filter((it) => it.done && (it.text || '').trim());
        if (!open.length && !done.length) return false;
        const openList = document.createElement('div');
        openList.className = 'dk-check-list';
        open.forEach((it) => openList.appendChild(viewCheckRow(it, card, rerenderFn)));
        host.appendChild(openList);
        if (done.length) {
          const label = document.createElement('div');
          label.className = 'dk-completed-label';
          label.textContent = 'Completed';
          const doneList = document.createElement('div');
          doneList.className = 'dk-check-list';
          done.forEach((it) => doneList.appendChild(viewCheckRow(it, card, rerenderFn)));
          host.append(label, doneList);
        }
        return true;
      }

      function sectionHasContent(sec) {
        return !!(sec.title || '').trim() || !!(sec.body || '').trim();
      }

      function cardHasContent(card) {
        return (card.sections || []).some(sectionHasContent)
          || ensureCardChecklist(card).some((it) => (it.text || '').trim());
      }

      function renderCardSectionsView(card, host, emptyMessage) {
        host.innerHTML = '';
        const sections = (card.sections || []).filter(sectionHasContent);
        if (!sections.length) {
          if (emptyMessage) {
            host.innerHTML = '<div class="dk-empty">' + emptyMessage + '</div>';
          }
          return;
        }
        sections.forEach((sec) => {
          const box = document.createElement('article');
          box.className = 'dk-section-view';
          if (sec.title) {
            const title = document.createElement('h3');
            title.className = 'dk-section-view-title';
            title.textContent = sec.title;
            box.appendChild(title);
          }
          if ((sec.body || '').trim()) {
            const body = document.createElement('p');
            body.className = 'dk-section-view-body';
            body.textContent = sec.body;
            box.appendChild(body);
          }
          host.appendChild(box);
        });
      }

      function renderCard(opts) {
        const deck = ensureActiveDeck();
        const loc = activeCardLocation();
        const card = loc ? loc.card : null;
        if (!deck || !card) return openDeck(activeDeckId, { updateUrl: true });
        document.getElementById('card-title').value = card.title || '';
        const where = loc.stack
          ? 'In ' + (loc.stack.name || 'Stack') + ' · ' + (deck.name || 'Untitled')
          : 'In ' + (deck.name || 'Untitled');
        document.getElementById('card-view-deck').textContent = where;
        document.getElementById('btn-back-cards').textContent = loc.stack
          ? '← ' + (loc.stack.name || 'Stack')
          : '← ' + (deck.name || 'Cards');
        const list = document.getElementById('section-list');
        list.innerHTML = '';
        if (!card.sections.length) {
          const empty = document.createElement('div');
          empty.className = 'dk-empty';
          empty.innerHTML = '<strong>No sections yet.</strong><br>Add a section below to write notes.';
          list.appendChild(empty);
        }
        card.sections.forEach((sec) => {
          const box = document.createElement('div');
          box.className = 'dk-section';
          const head = document.createElement('div');
          head.className = 'dk-section-head';
          const title = document.createElement('input');
          title.className = 'dk-section-title';
          title.placeholder = 'Section title (optional)';
          title.value = sec.title || '';
          title.addEventListener('input', () => {
            sec.title = title.value;
            touchCard(card);
          });
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'dk-btn dk-btn-danger dk-btn-small';
          del.textContent = 'Remove section';
          del.addEventListener('click', async () => {
            const ok = await showConfirm({
              title: 'Remove section?',
              message: 'Remove this section from the card?',
              okLabel: 'Remove',
              danger: true,
            });
            if (!ok) return;
            card.sections = card.sections.filter((s) => s.id !== sec.id);
            touchCard(card);
            renderCard();
          });
          head.append(title);
          const body = document.createElement('textarea');
          body.className = 'dk-section-body';
          body.placeholder = 'Write notes for this section…';
          body.value = sec.body || '';
          body.addEventListener('input', () => {
            sec.body = body.value;
            touchCard(card);
          });
          const foot = document.createElement('div');
          foot.className = 'dk-section-foot';
          foot.appendChild(del);
          box.append(head, body, foot);
          list.appendChild(box);
        });
        renderChecklistEdit(card);
        markCardTitleValidity();
        if (opts && opts.focusTitle) {
          const titleInput = document.getElementById('card-title');
          titleInput.focus();
          titleInput.select();
        }
      }

      function setDeckEditing(on, opts) {
        deckEditing = !!on;
        renderCards();
        if (deckEditing) {
          const input = document.getElementById('deck-name');
          input.focus();
          input.select();
        }
        if (!opts || opts.updateUrl !== false) syncUrl(!!(opts && opts.replaceUrl));
      }

      function finishDeckEdit(opts) {
        const deck = deckById(activeDeckId);
        if (deck) {
          deck.name = document.getElementById('deck-name').value.trim() || 'Untitled';
          save();
        }
        setDeckEditing(false, opts);
      }

      function touchCard(card) {
        const target = card || activeCard();
        if (!target) return;
        target.updatedAt = Date.now();
        save();
      }

      function cardTitleInputValue() {
        return document.getElementById('card-title').value.trim();
      }

      function routeMatchesActiveCard(route) {
        if (route.tab !== 'cards' || route.cardId !== activeCardId || route.deckId !== activeDeckId) {
          return false;
        }
        const loc = findCardInDeck(activeDeckId, activeCardId);
        const stackId = loc && loc.stack ? loc.stack.id : null;
        return (route.stackId || null) === stackId;
      }

      function markCardTitleValidity() {
        const input = document.getElementById('card-title');
        const valid = !!cardTitleInputValue();
        input.classList.toggle('dk-card-title-input--invalid', !valid);
        return valid;
      }

      function tryCommitCardMeta() {
        if (currentView !== 'card' || !activeCardId) return true;
        if (!cardTitleInputValue()) {
          markCardTitleValidity();
          return false;
        }
        persistCardMeta();
        markCardTitleValidity();
        return true;
      }

      async function ensureCardNamed() {
        if (tryCommitCardMeta()) return true;
        await showAlert({
          title: 'Name required',
          message: 'Every card needs a name. Enter one before continuing.',
        });
        const input = document.getElementById('card-title');
        input.focus();
        input.select();
        return false;
      }

      function persistCardMeta() {
        const loc = activeCardLocation();
        const card = loc ? loc.card : null;
        const deck = ensureActiveDeck();
        if (!card || !deck) return;
        const title = cardTitleInputValue();
        if (!title) return;
        card.title = title;
        touchCard(card);
        syncUrl(true);
      }

      function showDecks(opts) {
        activeCardId = null;
        activeStackId = null;
        deckEditing = false;
        clearReviewState();
        show('decks');
        renderDecks();
        if (!opts || opts.updateUrl !== false) syncUrl(!!(opts && opts.replaceUrl));
      }

      function openDeck(id, opts) {
        activeDeckId = id;
        activeStackId = null;
        activeCardId = null;
        deckEditing = !!(opts && opts.edit);
        clearReviewState();
        show('cards');
        renderCards();
        if (!opts || opts.updateUrl !== false) syncUrl(!!(opts && opts.replaceUrl));
      }

      function openStack(stackId, opts) {
        const deck = ensureActiveDeck();
        if (!deck || !stackById(deck, stackId)) return;
        activeStackId = stackId;
        activeCardId = null;
        deckEditing = false;
        clearReviewState();
        show('cards');
        renderCards();
        if (!opts || opts.updateUrl !== false) syncUrl(!!(opts && opts.replaceUrl));
      }

      function openCard(id, opts) {
        activeCardId = id;
        if (opts && opts.stackId !== undefined) activeStackId = opts.stackId;
        else {
          const found = findCardInDeck(activeDeckId, id);
          if (found) activeStackId = found.stack ? found.stack.id : null;
        }
        clearReviewState();
        show('card');
        renderCard({ focusTitle: !!(opts && opts.focusTitle) });
        if (!opts || opts.updateUrl !== false) syncUrl(!!(opts && opts.replaceUrl));
      }

      function reviewDeck() {
        return reviewDeckId ? deckById(reviewDeckId) : null;
      }

      function reviewCardsList() {
        const deck = reviewDeck();
        if (!deck) return [];
        return allReviewCards(deck, reviewScope, reviewStackId, reviewCardId);
      }

      function reviewCard() {
        const deck = reviewDeck();
        if (!deck || !reviewCardId) return null;
        return cardInDeck(deck.id, reviewCardId);
      }

      function openReview(deckId, opts) {
        opts = opts || {};
        const deck = deckById(deckId);
        const scope = opts.scope || 'deck';
        const stackId = opts.stackId || null;
        const cards = deck ? allReviewCards(deck, scope, stackId, opts.cardId) : [];
        if (!deck || !cards.length) {
          showAlert({
            title: 'Nothing to review',
            message: scope === 'stack'
              ? 'Add cards to this stack before reviewing it.'
              : scope === 'card'
                ? 'This card is empty or missing.'
                : 'Add cards to this deck before reviewing it.',
          });
          return;
        }
        activeDeckId = deck.id;
        activeStackId = stackId;
        activeCardId = null;
        deckEditing = false;
        reviewDeckId = deck.id;
        reviewStackId = stackId;
        reviewScope = scope;
        reviewCardId = opts.cardId && cardInDeck(deck.id, opts.cardId)
          ? opts.cardId
          : cards[0].id;
        show('review');
        renderReview();
        if (!opts || opts.updateUrl !== false) syncUrl(!!(opts && opts.replaceUrl));
      }

      function exitReview(opts) {
        const deckId = reviewDeckId;
        const stackId = reviewStackId;
        clearReviewState();
        if (deckId && stackId) openStack(stackId, opts);
        else if (deckId) openDeck(deckId, opts);
        else showDecks(opts);
      }

      function reviewStep(delta) {
        if (reviewScope === 'card') return;
        const cards = reviewCardsList();
        const idx = cards.findIndex((c) => c.id === reviewCardId);
        if (idx < 0) return;
        const next = cards[idx + delta];
        if (!next) return;
        reviewCardId = next.id;
        renderReview();
        syncUrl(true);
      }

      function renderReview() {
        const deck = reviewDeck();
        const card = reviewCard();
        const cards = reviewCardsList();
        if (!deck || !card || !cards.length) return exitReview({ updateUrl: true });
        const idx = cards.findIndex((c) => c.id === card.id);
        let label = deck.name || 'Untitled';
        if (reviewScope === 'stack' && reviewStackId) {
          const stack = stackById(deck, reviewStackId);
          if (stack) label = stack.name || 'Stack';
        } else if (reviewScope === 'card') {
          label = 'Single card';
        }
        document.getElementById('review-deck-name').textContent = label;
        document.getElementById('review-progress').textContent = reviewScope === 'card'
          ? 'Review'
          : ((idx + 1) + ' / ' + cards.length);
        document.getElementById('btn-review-prev').disabled = reviewScope === 'card' || idx <= 0;
        document.getElementById('btn-review-next').disabled = reviewScope === 'card' || idx >= cards.length - 1;
        const body = document.getElementById('review-body');
        body.innerHTML = '';
        const title = document.createElement('h2');
        title.className = 'dk-review-title';
        title.textContent = card.title || 'Untitled card';
        body.appendChild(title);
        const sectionsHost = document.createElement('div');
        renderCardSectionsView(card, sectionsHost, 'This card has no notes yet.');
        body.appendChild(sectionsHost);
        const checklistHost = document.createElement('div');
        if (renderChecklistView(card, checklistHost, renderReview)) {
          const box = document.createElement('div');
          box.className = 'dk-card-checklist';
          box.style.marginTop = '12px';
          const label = document.createElement('p');
          label.className = 'dk-card-checklist-label';
          label.textContent = 'Checklist';
          box.append(label, checklistHost);
          body.appendChild(box);
        }
      }

      function cardParentList(deck, stackId) {
        if (stackId) {
          const stack = stackById(deck, stackId);
          if (!stack) return null;
          if (!Array.isArray(stack.cards)) stack.cards = [];
          return stack.cards;
        }
        if (!Array.isArray(deck.cards)) deck.cards = [];
        return deck.cards;
      }

      async function createCard() {
        const deck = ensureActiveDeck();
        if (!deck) return;
        const list = cardParentList(deck, activeStackId);
        if (!list) return;
        let title = '';
        while (!title) {
          const name = await showPrompt({
            title: 'New card',
            message: 'Give your card a name.',
            label: 'Card name',
            maxLength: 160,
            okLabel: 'Create',
          });
          if (name === null) return;
          title = name.trim();
          if (!title) {
            await showAlert({
              title: 'Name required',
              message: 'A card name is required.',
            });
          }
        }
        const card = {
          id: uidId(),
          title: title,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          sections: [],
          checklist: [],
        };
        list.unshift(card);
        save();
        openCard(card.id, { stackId: activeStackId });
      }

      async function createStack() {
        const deck = ensureActiveDeck();
        if (!deck || activeStackId) return;
        const name = await showPrompt({
          title: 'New stack',
          message: 'Stacks group cards inside a deck. You cannot nest stacks inside stacks.',
          label: 'Stack name',
          okLabel: 'Create',
        });
        if (name === null) return;
        if (!Array.isArray(deck.stacks)) deck.stacks = [];
        const stack = {
          id: uidId(),
          name: name || 'Untitled stack',
          createdAt: Date.now(),
          cards: [],
        };
        deck.stacks.unshift(stack);
        save();
        openStack(stack.id);
      }

      document.getElementById('btn-new-deck').addEventListener('click', async () => {
        const name = await showPrompt({
          title: 'New deck',
          message: 'Give your deck a name.',
          label: 'Deck name',
          okLabel: 'Create',
        });
        if (name === null) return;
        const deck = {
          id: uidId(),
          name: name || 'Untitled',
          createdAt: Date.now(),
          cards: [],
          stacks: [],
        };
        state.decks.unshift(deck);
        save();
        openDeck(deck.id);
      });

      document.getElementById('btn-back-decks').addEventListener('click', () => {
        if (activeStackId) openDeck(activeDeckId);
        else showDecks();
      });

      document.getElementById('dk-bottom-nav').addEventListener('click', (ev) => {
        const btn = ev.target.closest('[data-dk-tab]');
        if (!btn) return;
        const tab = btn.getAttribute('data-dk-tab');
        if (tab === 'decks') {
          ensureCardNamed().then((ok) => {
            if (!ok) return;
            deckEditing = false;
            showDecks();
          });
          return;
        }
        if (tab === 'cards') {
          ensureCardNamed().then((ok) => {
            if (!ok) return;
            const deck = ensureActiveDeck();
            if (!deck) {
              showDecks();
              showAlert({
                title: 'Create a deck first',
                message: 'Make a deck, then add cards into it.',
              });
              return;
            }
            openDeck(deck.id);
          });
        }
      });

      document.getElementById('btn-cancel-deck-edit').addEventListener('click', () => {
        const deck = deckById(activeDeckId);
        if (deck) document.getElementById('deck-name').value = deck.name || '';
        setDeckEditing(false);
      });
      document.getElementById('btn-save-deck').addEventListener('click', () => finishDeckEdit());

      document.getElementById('deck-name').addEventListener('change', () => {
        const deck = deckById(activeDeckId);
        if (!deck) return;
        deck.name = document.getElementById('deck-name').value.trim() || 'Untitled';
        save();
        document.getElementById('cards-heading').textContent = deck.name;
      });

      document.getElementById('card-search').addEventListener('input', renderCards);

      document.getElementById('btn-new-card').addEventListener('click', () => createCard());
      document.getElementById('btn-new-card-stack').addEventListener('click', () => createCard());
      document.getElementById('btn-new-stack').addEventListener('click', () => createStack());
      document.getElementById('btn-new-card-edit').addEventListener('click', () => createCard());

      document.getElementById('btn-delete-deck').addEventListener('click', () => deleteDeckById(activeDeckId));

      document.getElementById('btn-back-cards').addEventListener('click', async () => {
        if (!(await ensureCardNamed())) return;
        const loc = activeCardLocation();
        if (loc && loc.stack) openStack(loc.stack.id);
        else openDeck(activeDeckId);
      });

      document.getElementById('btn-review-card').addEventListener('click', async () => {
        const loc = activeCardLocation();
        if (!loc) return;
        if (!(await ensureCardNamed())) return;
        openReview(activeDeckId, {
          scope: 'card',
          cardId: loc.card.id,
          stackId: loc.stack ? loc.stack.id : null,
        });
      });

      document.getElementById('btn-delete-card').addEventListener('click', async () => {
        const deck = ensureActiveDeck();
        const card = activeCard();
        if (!deck || !card) return;
        const label = card.title ? '“' + card.title + '”' : 'this card';
        const ok = await showConfirm({
          title: 'Delete card?',
          message: 'Delete ' + label + ' and all of its sections? This cannot be undone.',
          okLabel: 'Delete',
          danger: true,
        });
        if (!ok) return;
        const loc = activeCardLocation();
        if (loc && loc.stack) {
          loc.stack.cards = loc.stack.cards.filter((c) => c.id !== loc.card.id);
        } else if (loc) {
          deck.cards = deck.cards.filter((c) => c.id !== loc.card.id);
        }
        activeCardId = null;
        save();
        if (activeStackId) openStack(activeStackId, { replaceUrl: false });
        else openDeck(deck.id, { replaceUrl: false });
      });

      document.getElementById('card-title').addEventListener('input', () => {
        if (cardTitleInputValue()) persistCardMeta();
        else markCardTitleValidity();
      });

      document.getElementById('btn-add-section').addEventListener('click', () => {
        const card = activeCard();
        if (!card) return;
        card.sections.push(section({ body: '' }));
        touchCard(card);
        renderCard();
      });

      document.getElementById('btn-exit-review').addEventListener('click', () => exitReview());
      document.getElementById('btn-review-prev').addEventListener('click', () => reviewStep(-1));
      document.getElementById('btn-review-next').addEventListener('click', () => reviewStep(1));
      document.addEventListener('keydown', (ev) => {
        if (reviewDeckId && !modalEl.classList.contains('open')) {
          if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            reviewStep(-1);
          } else if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            reviewStep(1);
          } else if (ev.key === 'Escape') {
            ev.preventDefault();
            exitReview();
          }
        }
      });

      window.addEventListener('popstate', () => applyRouteFromUrl(false));
      window.addEventListener('hashchange', () => applyRouteFromUrl(false));
      window.addEventListener('beforeunload', () => { flushDeckCloudSync(); });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) handleDeckResume();
        else startDeckSyncPoll();
      });
      window.addEventListener('focus', handleDeckResume);

      bootDeck();
    })();
  </script>
</body>
</html>
