<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Deck — Ahrens Labs</title>
  <meta name="description" content="Deck — organize notes in decks of cards, with sections and a checklist per card.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-site-menu.css?v=20260821deck">
  <link rel="icon" type="image/png" sizes="512x512" href="/img/deck-favicon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/deck-favicon-192.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/img/deck-favicon-128.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/img/deck-favicon-96.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/img/deck-favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/deck-favicon-32.png">
  <link rel="icon" href="/img/deck-favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/deck-favicon-180.png">
  <link rel="manifest" href="/deck-manifest.webmanifest">
  <script src="js/script.js"></script>
  <script src="js/header_nav.js"></script>
  <style>
    :root {
      --dk-ink: #0f172a;
      --dk-muted: #64748b;
      --dk-line: #e0e7ff;
      --dk-card: #ffffff;
      --dk-bg: #eef2ff;
      --dk-brand: #4f46e5;
      --dk-brand-2: #7c3aed;
    }
    .deck-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: contain;
    }
    body.deck-app {
      min-height: 100dvh;
      background: var(--dk-bg);
      overflow-x: hidden;
      justify-content: flex-start;
      align-items: stretch;
    }
    body.deck-app .wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex: 1 1 auto;
      background: transparent;
    }
    body.deck-app main.dk-main {
      flex: 1 1 auto;
      max-width: none;
      margin: 0;
      padding: 0;
      display: block;
    }
    .dk-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px));
      font-family: Inter, system-ui, sans-serif;
      width: 100%;
      box-sizing: border-box;
    }
    .dk-bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      justify-content: space-around;
      gap: 4px;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--dk-line);
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }
    .dk-bottom-nav-item {
      flex: 1;
      max-width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 10px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--dk-muted);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .dk-bottom-nav-item:hover {
      color: var(--dk-brand);
      background: #f8fafc;
    }
    .dk-bottom-nav-item.active {
      color: var(--dk-brand);
      background: #eef2ff;
    }
    .dk-bottom-nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
    }
    .dk-bottom-nav-icon img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: block;
    }
    .dk-bottom-nav-icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dk-hero { margin: 4px 0 18px; }
    .dk-hero h2 {
      margin: 0 0 6px;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--dk-ink);
    }
    .dk-hero p {
      margin: 0;
      color: var(--dk-muted);
      font-size: 0.98rem;
      line-height: 1.55;
    }
    .dk-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 16px;
    }
    .dk-context-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 16px;
      flex-wrap: wrap;
    }
    .dk-context-bar .dk-btn-back { margin-right: auto; }
    .dk-secondary-actions { margin: 4px 0 16px; }
    .dk-footer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .dk-footer-actions .dk-btn { flex: 1 1 0; min-width: 120px; }
    .dk-btn-block { width: 100%; }
    .dk-btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dk-btn-primary {
      background: linear-gradient(135deg, var(--dk-brand), var(--dk-brand-2));
      color: #fff;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.28);
    }
    .dk-btn-ghost {
      background: #fff;
      color: var(--dk-ink);
      border: 1px solid var(--dk-line);
    }
    .dk-btn-back {
      background: #fff;
      color: var(--dk-ink);
      border: 1px solid var(--dk-line);
    }
    .dk-btn-danger {
      background: #fff;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .dk-btn-small {
      padding: 6px 10px;
      font-size: 0.8rem;
    }
    .dk-list { display: grid; gap: 10px; }
    .dk-deck-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--dk-card);
      border: 1px solid var(--dk-line);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 4px 14px rgba(49, 46, 129, 0.05);
    }
    .dk-deck-open {
      flex: 1 1 auto;
      min-width: 0;
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .dk-deck-open:hover { opacity: 0.82; }
    .dk-deck-open h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--dk-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dk-deck-open p {
      margin: 2px 0 0;
      color: var(--dk-muted);
      font-size: 0.78rem;
      line-height: 1.3;
    }
    .dk-deck-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      flex-shrink: 0;
      max-width: 52%;
    }
    .dk-deck-actions .dk-btn {
      padding: 7px 9px;
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .dk-list-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .dk-list-actions .dk-btn { flex: 1; min-width: 0; }
    .dk-stack-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .dk-stack-open {
      flex: 1 1 auto;
      min-width: 0;
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .dk-stack-open h3 {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--dk-ink);
    }
    .dk-stack-open p {
      margin: 2px 0 0;
      font-size: 0.76rem;
      color: var(--dk-muted);
    }
    .dk-stack-badge {
      display: inline-block;
      margin-right: 6px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--dk-brand);
    }
    .dk-item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .dk-item-actions .dk-btn {
      padding: 6px 9px;
      font-size: 0.76rem;
    }
    .dk-cards-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .dk-cards-toolbar .dk-btn { white-space: nowrap; }
    #dk-modal-field { margin-top: 14px; }
    #dk-modal-field.hidden { display: none; }
    .dk-item-card {
      background: var(--dk-card);
      border: 1px solid var(--dk-line);
      border-radius: 16px;
      padding: 14px 16px;
      display: block;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(49, 46, 129, 0.06);
    }
    .dk-item-card:hover { border-color: #c7d2fe; }
    .dk-item-card h3 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--dk-ink);
    }
    .dk-item-card p {
      margin: 0;
      color: var(--dk-muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }
    .dk-empty {
      background: #fff;
      border: 1px dashed #c7d2fe;
      border-radius: 16px;
      padding: 28px 18px;
      text-align: center;
      color: var(--dk-muted);
    }
    .dk-empty strong { color: var(--dk-ink); }
    .dk-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .dk-field label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
    }
    .dk-field input,
    .dk-field textarea,
    .dk-field select,
    .dk-section-title,
    .dk-check-text,
    .dk-check-add,
    .dk-search {
      font: inherit;
      border: 1px solid var(--dk-line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      color: var(--dk-ink);
      width: 100%;
      box-sizing: border-box;
    }
    .dk-field textarea { min-height: 120px; resize: vertical; }
    .dk-section-body {
      display: block;
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid #c7d2fe;
      padding: 14px 16px;
      line-height: 1.65;
      font-size: 0.98rem;
      box-sizing: border-box;
      background: #fff;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .dk-section-body:focus {
      outline: none;
      border-color: var(--dk-brand);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .dk-search { margin: 0 0 14px; border-radius: 12px; }
    .dk-section {
      background: #fff;
      border: 1px solid var(--dk-line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .dk-section-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .dk-section-head {
      margin-bottom: 10px;
    }
    .dk-card-checklist {
      background: #fff;
      border: 1px solid var(--dk-line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 4px;
    }
    .dk-card-checklist-label {
      margin: 0 0 10px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dk-muted);
    }
    .dk-check-list { display: grid; gap: 6px; }
    .dk-check-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dk-check-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--dk-brand);
      flex-shrink: 0;
    }
    .dk-check-row.done .dk-check-text {
      text-decoration: line-through;
      color: #94a3b8;
      background: #f8fafc;
    }
    .dk-completed-label {
      margin: 12px 0 6px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .dk-check-remove {
      border: 0;
      background: transparent;
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
    .dk-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10100;
      background: rgba(15, 23, 42, 0.45);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .dk-modal-backdrop.open { display: flex; }
    .dk-modal {
      width: min(400px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
    }
    .dk-modal h3 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--dk-ink);
    }
    .dk-modal p {
      margin: 0;
      color: var(--dk-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .dk-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .dk-meta {
      margin: 0 0 16px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--dk-muted);
    }
    .dk-view-title {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--dk-ink);
    }
    .dk-card-title-input {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 4px 2px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      font: inherit;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--dk-ink);
      box-sizing: border-box;
    }
    .dk-card-title-input:focus {
      outline: none;
      border-color: #c7d2fe;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .dk-card-title-input::placeholder { color: #94a3b8; }
    .dk-card-title-input--invalid,
    .dk-card-title-input:required:invalid:not(:focus) {
      border-color: #fca5a5;
      background: #fff5f5;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
    }
    .dk-card-title-field { margin-bottom: 8px; }
    .dk-card-title-field label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--dk-muted);
      letter-spacing: 0.02em;
    }
    .dk-card-delete-wrap { margin-top: 28px; }
    .dk-card-preview-item {
      background: var(--dk-card);
      border: 1px solid var(--dk-line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(49, 46, 129, 0.06);
    }
    .dk-card-preview-item:hover { border-color: #c7d2fe; }
    .dk-card-preview-open {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .dk-card-preview-inner {
      padding: 14px 16px;
    }
    .dk-card-preview-title {
      margin: 0 0 10px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--dk-ink);
    }
    .dk-card-preview-body .dk-section-view {
      margin-bottom: 8px;
      padding: 10px 12px;
    }
    .dk-card-preview-body .dk-card-checklist {
      margin-top: 8px;
      padding: 10px 12px;
    }
    .dk-card-preview-empty {
      margin: 0;
      color: var(--dk-muted);
      font-size: 0.9rem;
      font-style: italic;
    }
    .dk-check-static-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 3px 0;
      color: var(--dk-ink);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .dk-check-static-row.done { color: #94a3b8; text-decoration: line-through; }
    .dk-check-static-mark {
      width: 18px;
      flex-shrink: 0;
      text-align: center;
      color: var(--dk-brand);
      font-weight: 700;
    }
    .dk-check-static-row.done .dk-check-static-mark { color: #94a3b8; }
    .dk-section-view {
      background: #fff;
      border: 1px solid var(--dk-line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .dk-section-view-title {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 800;
      color: var(--dk-ink);
    }
    .dk-section-view-body {
      margin: 0;
      color: var(--dk-ink);
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .dk-section-view-empty {
      margin: 0;
      color: var(--dk-muted);
      font-size: 0.9rem;
      font-style: italic;
    }
    .dk-view-check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 4px 0;
    }
    .dk-view-check-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: var(--dk-brand);
      flex-shrink: 0;
    }
    .dk-view-check-row span {
      flex: 1;
      line-height: 1.45;
      color: var(--dk-ink);
    }
    .dk-view-check-row.done span {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .dk-review {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--dk-bg);
      display: flex;
      flex-direction: column;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
    }
    .dk-review-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .dk-review-deck {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--dk-muted);
    }
    .dk-review-progress {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--dk-brand);
      white-space: nowrap;
    }
    .dk-review-body {
      flex: 1 1 auto;
      overflow: auto;
      min-height: 0;
      background: #fff;
      border: 1px solid var(--dk-line);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 10px 30px rgba(49, 46, 129, 0.08);
    }
    .dk-review-title {
      margin: 0 0 14px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--dk-ink);
    }
    .dk-review-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
      flex-shrink: 0;
    }
    body.deck-app.dk-reviewing .th-app-header,
    body.deck-app.dk-reviewing .dk-bottom-nav,
    body.deck-app.dk-reviewing .dk-wrap { display: none !important; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="dk-page deck-app">
  <div class="wrapper">
    <header class="th-app-header">
      <div class="th-app-topbar">
        <div class="th-topbar-start">
          <button type="button" class="th-hamburger" id="th-site-menu-btn" aria-label="Open site menu" aria-expanded="false" aria-controls="th-site-menu">
            <span></span><span></span><span></span>
          </button>
          <div class="th-topbar-brand">
            <img src="img/deck-logo-128.png" alt="" class="deck-logo">
            <h1 class="th-topbar-title">Deck</h1>
          </div>
        </div>
        <div class="th-topbar-auth" id="header-auth-buttons">
          <button type="button" id="header-login-btn" class="th-topbar-auth-btn th-topbar-auth-login" onclick="window.location.href='account.html?return=deck.html'">Login</button>
          <button type="button" id="header-signup-btn" class="th-topbar-auth-btn th-topbar-auth-signup" onclick="window.location.href='account.html?return=deck.html'">Sign Up</button>
          <span id="header-username" class="th-topbar-username"></span>
        </div>
      </div>
      <div id="th-site-menu-backdrop" class="th-site-menu-backdrop" hidden></div>
      <div id="th-site-menu" class="th-site-menu" aria-hidden="true">
        <div class="th-site-menu-head">
          <a href="index.html" class="th-site-menu-brand">
            <img src="img/EagleLogo.png" alt="" class="header-logo">
            <span>Ahrens Labs</span>
          </a>
          <button type="button" class="th-site-menu-close" id="th-site-menu-close" aria-label="Close menu">&times;</button>
        </div>
